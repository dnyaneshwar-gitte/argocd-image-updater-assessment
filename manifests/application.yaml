apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-updater-demo
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: demo=YOUR_ECR_REPO_URL
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/demo.force-update: "true"
    argocd-image-updater.argoproj.io/demo.update-strategy: latest
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/argocd-image-updater-assessment.git
    targetRevision: main
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true